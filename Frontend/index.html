<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="estilos.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <!-- Librería para mostrar alertas amigables -->
  <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
  <!-- Lógica JS que consume la API del backend -->
  <script src="app.js"></script>
  <title>Gestor de contraseñas</title>
</head>
<body style="background-color: rgb(247, 249, 252)">
  <div id="main" class="container">
    <div id="marco" class="container my-5 text-center">
      <h1>Gestor de contraseñas</h1>
      <table class="table table-striped table-hover">
        <thead>
          <tr>
            <th scope="col">#</th>
            <th scope="col">Plataforma</th>
            <th scope="col">Usuario</th>
            <th scope="col">Contraseña</th>
            <th scope="col">Editar</th>
            <th scope="col">Eliminar</th>
          </tr>
        </thead>
        <!-- Aquí se insertan dinámicamente las filas con los datos del baúl -->
        <tbody id="data">
        </tbody>
      </table>
      <button type='button' class="btn btn-primary" onclick="location.href = 'add.html'">
        <img src='imagenes/add.png' height='30' width='30'/>Agregar</button>
    </div>
    <script>
      // Al cargar la página se hace la consulta general (GET) al backend
      // para llenar la tabla con todos los registros existentes.
      consulta_general();
    </script>
  </div>
</body>
</html>
